services:
  # Mailpit (SMTP on 1025, web UI on 8025)
  mailpit:
    image: axllent/mailpit:latest
    logging:
      driver: "none"
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - wpsite
  # Database
  db:
    container_name: db-${PROJECT}
    image: mysql:8.0
    volumes:
      - db_data:/var/lib/mysql
    #    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    networks:
      - wpsite
  # phpmyadmin
  phpmyadmin:
    container_name: phpmyadmin-${PROJECT}
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    #    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 300M
      MYSQL_ROOT_PASSWORD: password
    networks:
      - wpsite
  # Wordpress
  phpapache:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    depends_on:
      - db

    container_name: phpapache-${PROJECT}
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/
      # Run Apache/PHP as the owner of the files (the host user, created in the Dockerfile), so WordPress can
      # write plugins and themes (get_filesystem_method() is "direct" only when PHP owns the files).
      APACHE_RUN_USER: app
      APACHE_RUN_GROUP: app
    volumes:
      - ./:/var/www/html/
      - ../certs/_wildcard.projects.local.pem:/etc/ssl/certs/projects.local.crt
      - ../certs/_wildcard.projects.local-key.pem:/etc/ssl/private/projects.local.key
      - ../certs/_wildcard.projects.local.pem:/usr/local/share/ca-certificates/projects.local.crt
    ports:
      - 80:80
      - 443:443
    networks:
      - wpsite
    command: >
      sh -c "
        update-ca-certificates &&
        apache2-foreground
      "

  wp-cli:
    container_name: wp-cli-${PROJECT}
    depends_on:
      - phpapache
      - db
    image: wordpress:cli-php8.4
    user: 1000:1000
    command: tail -f /dev/null
    volumes: ["./:/var/www/html"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    networks:
      - wpsite

networks:
  wpsite:
volumes:
  db_data:
