<VirtualHost *:80>
    ServerName xxx.projects.local
    Redirect permanent / https://xxx.projects.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName xxx.projects.local
    DocumentRoot /var/www/html/

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/projects.local.crt
    SSLCertificateKeyFile /etc/ssl/private/projects.local.key

    <Directory "/var/www/html/">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Repeat <VirtualHost> for mcs.projects.local, wzasieguciepla.projects.local, etc.
